basePath: /
definitions:
  controllers.createAppointmentRequest:
    properties:
      comment:
        example: Хочу записаться на консультацию
        type: string
      psychologist_id:
        example: 1
        type: integer
    type: object
  controllers.loginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  controllers.registerRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  controllers.resetCodeRequest:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  controllers.resetPasswordRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: user@example.com
        type: string
      new_password:
        example: newpassword123
        type: string
    type: object
  controllers.vacationRequest:
    properties:
      date_from:
        example: "2026-06-01"
        type: string
      date_to:
        example: "2026-06-10"
        type: string
      reason:
        example: vacation
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Сервис авторизации для психологической платформы
  title: Auth Service API
  version: "1.0"
paths:
  /admin/appointments:
    get:
      description: Возвращает все записи — только для администратора
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Все записи (админ)
      tags:
      - admin
  /admin/appointments/{id}/approve:
    patch:
      description: Меняет статус записи на approved
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID записи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Принять запись (админ)
      tags:
      - admin
  /admin/appointments/{id}/reject:
    patch:
      description: Меняет статус записи на rejected
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID записи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отклонить запись (админ)
      tags:
      - admin
  /admin/chat/{id}:
    get:
      description: Возвращает историю сообщений конкретного пользователя
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: История чата пользователя (админ)
      tags:
      - chat
  /admin/chat/{id}/export:
    get:
      description: Возвращает историю чата пользователя в формате JSON файла
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Экспорт чата в JSON (админ)
      tags:
      - chat
  /admin/chats:
    get:
      description: Возвращает последнее сообщение от каждого пользователя
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Список всех чатов (админ)
      tags:
      - chat
  /admin/psychologists/{id}/vacation:
    post:
      consumes:
      - application/json
      description: Устанавливает период недоступности психолога
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID психолога
        in: path
        name: id
        required: true
        type: integer
      - description: Период отпуска
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.vacationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить выходной/отпуск психологу (админ)
      tags:
      - admin
  /admin/psychologists/vacation/{id}:
    delete:
      description: Удаляет период недоступности психолога
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID записи расписания
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить выходной/отпуск психолога (админ)
      tags:
      - admin
  /appointments:
    post:
      consumes:
      - application/json
      description: Создаёт запись к психологу для авторизованного пользователя
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      - description: Данные записи
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.createAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Записаться к психологу
      tags:
      - appointments
  /appointments/my:
    get:
      description: Возвращает список записей авторизованного пользователя
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Мои записи
      tags:
      - appointments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Возвращает JWT токен при успешной авторизации
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход в аккаунт
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя по email и паролю
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Сбрасывает пароль пользователя по коду из email
      parameters:
      - description: Данные для сброса пароля
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Сброс пароля
      tags:
      - auth
  /auth/send-reset-code:
    post:
      consumes:
      - application/json
      description: Отправляет 6-значный код на email для сброса пароля
      parameters:
      - description: Email пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.resetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отправка кода восстановления
      tags:
      - auth
  /chat/history:
    get:
      description: Возвращает историю сообщений авторизованного пользователя
      parameters:
      - description: Bearer токен
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: История моего чата
      tags:
      - chat
  /psychologists:
    get:
      description: Возвращает список всех психологов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Список психологов
      tags:
      - psychologists
  /psychologists/{id}:
    get:
      description: Возвращает информацию о конкретном психологе
      parameters:
      - description: ID психолога
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Информация о психологе
      tags:
      - psychologists
  /psychologists/{id}/availability:
    get:
      description: Проверяет доступен ли психолог на указанную дату
      parameters:
      - description: ID психолога
        in: path
        name: id
        required: true
        type: integer
      - description: Дата в формате YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверить доступность психолога
      tags:
      - psychologists
  /psychologists/{id}/vacations:
    get:
      description: Возвращает список выходных и отпусков психолога
      parameters:
      - description: ID психолога
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Расписание психолога
      tags:
      - psychologists
  /ws/admin/chat:
    get:
      description: Подключение администратора к чату через WebSocket
      parameters:
      - description: JWT токен администратора
        in: query
        name: token
        required: true
        type: string
      responses: {}
      summary: WebSocket чат администратора
      tags:
      - chat
  /ws/chat:
    get:
      description: Подключение пользователя к чату с администратором через WebSocket
      parameters:
      - description: JWT токен
        in: query
        name: token
        required: true
        type: string
      responses: {}
      summary: WebSocket чат пользователя
      tags:
      - chat
swagger: "2.0"
